      const FooterLink = ({ href, children }) => (

      const Footer = () => (
        <footer className="bg-gray-900 text-gray-400 py-12">

                <img src="image/logo kbse white.png" alt="Teknologi KBSE Logo" className="h-12 w-auto" />
                <p className="text-sm">Teknologi KBSE Sdn Bhd (0759215-M)</p>
                <p className="text-sm">1-11-2 & 1-11-3, Presint Alami, Pusat Perdagangan Worldwide 2 Persiaran Akuatik, Seksyen 13, 40100 Shah Alam, Selangor, Malaysia.</p>
              </div>
              <div>
                <h3 className="text-sm font-semibold text-white tracking-wider uppercase">Quick Links</h3>
                <ul className="mt-4 space-y-2">
                  <li><FooterLink href="index.html">Home</FooterLink></li>
                  <li><FooterLink href="overview.html">About Us</FooterLink></li>
                  <li><FooterLink href="product.html">Projects & Services</FooterLink></li>

                  <li><FooterLink href="team.html">Leadership</FooterLink></li>

            <div className="mt-12 border-t border-gray-700 pt-8 text-center text-sm">
              <p>&copy; {new Date().getFullYear()} Teknologi KBSE Sdn. Bhd. All rights reserved.</p>
            </div>
          </div>
        </footer>
      );

      const AnimatedSection = ({ children, className = '', delay = 0 }) => {
        const [isVisible, setIsVisible] = useState(false);
        const sectionRef = useRef(null);

        useEffect(() => {
          const observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                setIsVisible(true);
                observer.unobserve(entry.target);
              }
            },
            { threshold: 0.1 }
          );
          if (sectionRef.current) observer.observe(sectionRef.current);
          return () => observer.disconnect();
        }, []);

        return (
          <div
            ref={sectionRef}
            className={`transition-all duration-1000 ease-out ${
              isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'
            } ${className}`}
            style={{ transitionDelay: `${delay}ms` }}
          >
            {children}
          </div>
        );
      };

      const SectionTitle = ({ children, className = '' }) => (
        <h2 className={`text-2xl md:text-3xl font-bold mb-4 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 ${className}`}>
          {children}
        </h2>
      );

      // === Blog Specific Components ===

      const CommentSection = ({ postId, t }) => {
        const [comments, setComments] = useState([]);
        const [name, setName] = useState('');
        const [text, setText] = useState('');

        useEffect(() => {
          const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
          setComments(savedComments);
        }, [postId]);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim() || !text.trim()) return;

          const newComment = {
            id: Date.now(),
            name,
            text,
            date: new Date().toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
          };

          const updatedComments = [newComment, ...comments];
          setComments(updatedComments);
          localStorage.setItem(`comments_${postId}`, JSON.stringify(updatedComments));
          setName('');
          setText('');
        };

        return (
          <div className="mt-12 border-t border-gray-700 pt-8">
            <h4 className="text-xl font-bold text-white mb-6">{t.comments} ({comments.length})</h4>
            
            <form onSubmit={handleSubmit} className="mb-10 space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input 
                  type="text" 
                  placeholder={t.yourName}
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white focus:ring-2 focus:ring-amber-500 outline-none transition-all"
                  required
                  aria-label={t.yourName}
                />
              </div>
              <textarea 
                placeholder={t.shareThoughts}
                value={text}
                onChange={(e) => setText(e.target.value)}
                rows="3"
                className="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white focus:ring-2 focus:ring-amber-500 outline-none transition-all"
                required
                aria-label={t.shareThoughts}
              ></textarea>
              <button 
                type="submit"
                className="bg-amber-500 text-black font-bold py-2 px-6 rounded-lg hover:bg-amber-600 transition-all duration-300 transform active:scale-95 shadow-lg shadow-amber-500/20"
              >
                {t.postComment}
              </button>
            </form>

            <div className="space-y-6">
              {comments.length === 0 ? (
                <p className="text-gray-500 italic">{t.noComments}</p>
              ) : (
                comments.map(comment => (
                  <div key={comment.id} className="bg-gray-800/40 p-4 rounded-xl border border-gray-700/50">
                    <div className="flex justify-between items-start mb-2">
                      <h5 className="font-bold text-amber-400">{comment.name}</h5>
                      <span className="text-[10px] text-gray-500 uppercase tracking-wider">{comment.date}</span>
                    </div>
                    <p className="text-gray-300 text-sm leading-relaxed">{comment.text}</p>
                  </div>
                ))
              )}
            </div>
          </div>
        );
      };

      const BlogCard = ({ post, isGrid = false, isFeatured = false, onReadMore, language, t }) => {
        const handleShare = () => {
          if (navigator.share) {
            navigator.share({
              title: post.title[language],
              text: post.content[language][0],
              url: window.location.href,
            }).catch(console.error);
          } else {
            alert('Sharing is not supported on this browser. URL copied to clipboard!');
            navigator.clipboard.writeText(window.location.href);
          }
        };

        return (
          <article className={`bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-2xl overflow-hidden shadow-xl transition-all duration-500 hover:border-amber-500/50 hover:shadow-amber-500/20 group 
            ${isFeatured ? 'flex flex-col lg:flex-row mb-12' : 'flex flex-col h-full'}`}>
            
            <div className={`${isFeatured ? 'lg:w-1/2 aspect-video lg:aspect-auto' : 'aspect-[16/9]'} w-full overflow-hidden relative bg-gray-800`}>
              <img 
                src={post.imageUrl} 
                alt={post.title[language]} 
                className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                referrerPolicy="no-referrer"
                onError={(e) => {
                  e.target.src = "https://picsum.photos/seed/placeholder/1200/600?blur=10";
                  e.target.classList.add('opacity-50');
                }}
              />
              {isFeatured && (
                <div className="absolute top-4 left-4 z-10">
                  <span className="px-4 py-1.5 bg-amber-500 text-black text-[10px] font-black rounded-full uppercase tracking-widest shadow-xl">
                    {t.latestIssue}
                  </span>
                </div>
              )}
              <div className="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            </div>

            <div className={`p-6 flex-grow flex flex-col ${isFeatured ? 'lg:w-1/2 lg:p-12 lg:justify-center' : 'md:p-8'}`}>
              <div className="flex items-center gap-4 mb-4">
                <span className="text-[10px] md:text-xs text-gray-500 font-medium">{post.date}</span>
              </div>
              
              <h3 className={`${isFeatured ? 'text-2xl md:text-4xl' : 'text-xl md:text-2xl'} font-bold text-white mb-4 group-hover:text-amber-400 transition-colors leading-tight`}>
                {post.title[language]}
              </h3>
              
              <div className={`blog-content text-gray-400 text-sm md:text-base mb-8 leading-relaxed ${!isFeatured ? 'line-clamp-2' : 'line-clamp-3'}`}>
                <p>{post.content[language][0]}</p>
              </div>
              
              <div className="mt-auto pt-6 border-t border-gray-700/50 flex justify-between items-center">
                <button 
                  onClick={() => onReadMore(post)}
                  className="text-amber-500 text-sm font-bold hover:text-amber-400 transition-colors flex items-center gap-2 group/btn focus:outline-none focus:ring-2 focus:ring-amber-500 rounded px-1"
                >
                  {t.readFull}
                  <svg className="w-4 h-4 transform transition-transform group-hover/btn:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                  </svg>
                </button>
                
                <div className="flex items-center gap-4">
                  <button 
                    onClick={handleShare}
                    className="text-gray-500 hover:text-amber-500 transition-colors p-1.5 rounded-full hover:bg-gray-700/50"
                    aria-label={t.share}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6a3 3 0 100-2.684m0 2.684l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                    </svg>
                  </button>
                  
                  {!isFeatured && (
                    <span className="text-gray-500 text-[10px] md:text-xs flex items-center gap-1.5">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                      </svg>
                      {t.discussion}
                    </span>
                  )}
                </div>
              </div>

              {isFeatured && <CommentSection postId={post.id} t={t} />}
            </div>
          </article>
        );
      };

      const ArticleModal = ({ post, onClose, language, t }) => {
        if (!post) return null;

        return (
          <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8">
            <div

            <div className="relative bg-gray-900 w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl border border-gray-700 shadow-2xl animate-in fade-in zoom-in duration-300">

              </button>

              <div className="aspect-video w-full overflow-hidden bg-gray-800">
                <img 
                  src={post.imageUrl} 
                  alt={post.title[language]} 
                  className="w-full h-full object-cover"

              <div className="p-8 md:p-12">
                <div className="flex items-center gap-4 mb-6">

      const BlogPage = () => {
        const [language, setLanguage] = useState('en'); // 'en' or 'ms'
        const [isHeaderVisible, setIsHeaderVisible] = useState(true);
        const [searchTerm, setSearchTerm] = useState('');
        const [visibleCount, setVisibleCount] = useState(6);
        const [showBackToTop, setShowBackToTop] = useState(false);
        const [isLoadingMore, setIsLoadingMore] = useState(false);
        const [selectedPost, setSelectedPost] = useState(null);

        const translations = {
          en: {
            nav: {
              home: "Home",
              about: "About Us",
              overview: "Company Overview",
              team: "Leadership & Team",
              cert: "Certificates & Awards",
              projects: "Projects & Services",
              products: "Projects / Products",
              services: "Services",
              partners: "Partners & Clients",
              gallery: "Activities & Gallery",
              blog: "Blog",
              contact: "Contact Us",
              discover: "Discover",
              leadership: "Leadership",
              faq: "FAQ",
              legal: "Legal",
              privacy: "Privacy Policy",
              terms: "Terms & Conditions",

                      <div className="text-center py-24 bg-gray-800/20 rounded-3xl border border-dashed border-gray-700 px-6 backdrop-blur-sm">
                        <div className="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6">
                          <svg className="w-10 h-10 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                          </svg>
                        </div>
                        <p className="text-gray-400 text-lg md:text-xl font-light mb-8 italic">{t.noResults}</p>
                        <button 
                          onClick={() => {setSearchTerm('');}}
                          className="bg-amber-500 text-black px-8 py-3 rounded-2xl hover:bg-amber-600 transition-all font-black uppercase tracking-widest text-xs shadow-lg shadow-amber-500/20"
                        >
                          {t.clearSearch}
                        </button>
                      </div>
                    )}
                  </div>

                  {/* Newsletter / Suggestion Section */}
                  <AnimatedSection delay={400}>
                    <div className="mt-32 text-center bg-gradient-to-br from-gray-800/60 via-gray-900/40 to-gray-800/60 p-10 md:p-24 rounded-[3rem] border border-amber-500/10 shadow-3xl relative overflow-hidden group">
                      <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500/30 to-transparent"></div>
                      <div className="absolute -bottom-24 -right-24 w-64 h-64 bg-amber-500/5 rounded-full blur-3xl group-hover:bg-amber-500/10 transition-colors duration-700"></div>
                      
                      <h2 className="text-3xl md:text-5xl font-bold text-white mb-6 tracking-tight">{t.suggestTitle}</h2>
                      <p className="text-gray-400 mb-12 max-w-2xl mx-auto text-base md:text-xl font-light leading-relaxed">
                        {t.suggestSubtitle}
                      </p>
                      <a href="contact.html" className="bg-amber-500 text-black font-black py-5 px-14 rounded-2xl hover:bg-amber-600 transition-all duration-500 transform hover:scale-105 inline-block shadow-2xl shadow-amber-500/30 text-xs uppercase tracking-[0.2em]">
                        {t.suggestButton}
                      </a>
                    </div>
                  </AnimatedSection>
                </div>
              </main>

              <Footer t={t} />

              {/* Article Modal */}
              <ArticleModal post={selectedPost} onClose={() => setSelectedPost(null)} language={language} t={t} />

              {/* Back to Top Button */}
              <button 
                onClick={scrollToTop}
                className={`fixed bottom-6 right-6 md:bottom-10 md:right-10 z-50 p-4 md:p-5 bg-amber-500 text-black rounded-full shadow-[0_0_30px_rgba(245,158,11,0.3)] transition-all duration-500 transform ${showBackToTop ? 'translate-y-0 opacity-100 scale-100' : 'translate-y-20 opacity-0 scale-50 pointer-events-none'} hover:bg-amber-600 hover:scale-110 active:scale-90`}
                aria-label={t.backToTop}
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                </svg>
              </button>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<React.StrictMode><BlogPage /></React.StrictMode>);
    </script>
  </body>
</html>
