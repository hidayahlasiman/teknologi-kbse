      const AnimatedSection = ({ children, className = '', delay = 0 }) => {
        const [isVisible, setIsVisible] = useState(false);
        const sectionRef = useRef(null);

        useEffect(() => {
          const observer = new IntersectionObserver(
            ([entry]) => {
              if (entry.isIntersecting) {
                setIsVisible(true);
                observer.unobserve(entry.target);
              }
            },
            { threshold: 0.1 }
          );
          if (sectionRef.current) observer.observe(sectionRef.current);
          return () => observer.disconnect();
        }, []);

        return (
          <div
            ref={sectionRef}
            className={`transition-all duration-1000 ease-out ${
              isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'
            } ${className}`}
            style={{ transitionDelay: `${delay}ms` }}
          >
            {children}
          </div>
        );
      };

      const SectionTitle = ({ children, className = '' }) => (
        <h2 className={`text-2xl md:text-3xl font-bold mb-4 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-500 ${className}`}>
          {children}
        </h2>
      );

      // === Blog Specific Components ===

      const CommentSection = ({ postId, t }) => {
        const [comments, setComments] = useState([]);
        const [name, setName] = useState('');
        const [text, setText] = useState('');

        useEffect(() => {
          const savedComments = JSON.parse(localStorage.getItem(`comments_${postId}`)) || [];
          setComments(savedComments);
        }, [postId]);

        const handleSubmit = (e) => {
          e.preventDefault();
          if (!name.trim() || !text.trim()) return;

          const newComment = {
            id: Date.now(),
            name,
            text,
            date: new Date().toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
          };

          const updatedComments = [newComment, ...comments];
          setComments(updatedComments);
          localStorage.setItem(`comments_${postId}`, JSON.stringify(updatedComments));
          setName('');
          setText('');
        };

        return (
          <div className="mt-12 border-t border-gray-700 pt-8">
            <h4 className="text-xl font-bold text-white mb-6">{t.comments} ({comments.length})</h4>
            
            <form onSubmit={handleSubmit} className="mb-10 space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input 
                  type="text" 
                  placeholder={t.yourName}
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white focus:ring-2 focus:ring-amber-500 outline-none transition-all"
                  required
                  aria-label={t.yourName}
                />
              </div>
              <textarea 
                placeholder={t.shareThoughts}
                value={text}
                onChange={(e) => setText(e.target.value)}
                rows="3"
                className="w-full bg-gray-800 border border-gray-700 rounded-lg py-2 px-4 text-white focus:ring-2 focus:ring-amber-500 outline-none transition-all"
                required
                aria-label={t.shareThoughts}
              ></textarea>
              <button 
                type="submit"
                className="bg-amber-500 text-black font-bold py-2 px-6 rounded-lg hover:bg-amber-600 transition-all duration-300 transform active:scale-95 shadow-lg shadow-amber-500/20"
              >
                {t.postComment}
              </button>
            </form>

            <div className="space-y-6">
              {comments.length === 0 ? (
                <p className="text-gray-500 italic">{t.noComments}</p>
              ) : (
                comments.map(comment => (
                  <div key={comment.id} className="bg-gray-800/40 p-4 rounded-xl border border-gray-700/50">
                    <div className="flex justify-between items-start mb-2">
                      <h5 className="font-bold text-amber-400">{comment.name}</h5>
                      <span className="text-[10px] text-gray-500 uppercase tracking-wider">{comment.date}</span>
                    </div>
                    <p className="text-gray-300 text-sm leading-relaxed">{comment.text}</p>
                  </div>
                ))
              )}
            </div>
          </div>
        );
      };

      const BlogCard = ({ post, isGrid = false, isFeatured = false, onReadMore, language, t }) => {
        const handleShare = () => {
          if (navigator.share) {
            navigator.share({
              title: post.title[language],
              text: post.content[language][0],
              url: window.location.href,
            }).catch(console.error);
          } else {
            alert('Sharing is not supported on this browser. URL copied to clipboard!');
            navigator.clipboard.writeText(window.location.href);
          }
        };

        return (
          <article className={`bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-2xl overflow-hidden shadow-xl transition-all duration-500 hover:border-amber-500/50 hover:shadow-amber-500/20 group 
            ${isFeatured ? 'flex flex-col lg:flex-row mb-12' : 'flex flex-col h-full'}`}>
            
            <div className={`${isFeatured ? 'lg:w-1/2 aspect-video lg:aspect-auto' : 'aspect-[16/9]'} w-full overflow-hidden relative bg-gray-800`}>
              <img 
                src={post.imageUrl} 
                alt={post.title[language]} 
                className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                referrerPolicy="no-referrer"
                onError={(e) => {
                  e.target.src = "https://picsum.photos/seed/placeholder/1200/600?blur=10";
                  e.target.classList.add('opacity-50');
                }}
              />
              {isFeatured && (

              )}
              <div className="absolute inset-0 bg-gradient-to-t from-gray-900/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
            </div>

            <div className={`p-6 flex-grow flex flex-col ${isFeatured ? 'lg:w-1/2 lg:p-12 lg:justify-center' : 'md:p-8'}`}>

              <h3 className={`${isFeatured ? 'text-2xl md:text-4xl' : 'text-xl md:text-2xl'} font-bold text-white mb-4 group-hover:text-amber-400 transition-colors leading-tight`}>
                {post.title[language]}

              <div className={`blog-content text-gray-400 text-sm md:text-base mb-8 leading-relaxed ${!isFeatured ? 'line-clamp-2' : 'line-clamp-3'}`}>
                <p>{post.content[language][0]}</p>
              </div>
              
              <div className="mt-auto pt-6 border-t border-gray-700/50 flex justify-between items-center">

                  onClick={() => onReadMore(post)}
                  className="text-amber-500 text-sm font-bold hover:text-amber-400 transition-colors flex items-center gap-2 group/btn focus:outline-none focus:ring-2 focus:ring-amber-500 rounded px-1"
                >
                  {t.readFull}
                  <svg className="w-4 h-4 transform transition-transform group-hover/btn:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                  </svg>
                </button>
                
                <div className="flex items-center gap-4">
                  <button 
                    onClick={handleShare}
                    className="text-gray-500 hover:text-amber-500 transition-colors p-1.5 rounded-full hover:bg-gray-700/50"
                    aria-label={t.share}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6a3 3 0 100-2.684m0 2.684l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                    </svg>
                  </button>
                  
                  {!isFeatured && (
                    <span className="text-gray-500 text-[10px] md:text-xs flex items-center gap-1.5">

                      </svg>
                      {t.discussion}
                    </span>
                  )}

              </div>

            </div>
          </article>
        );

        const [searchTerm, setSearchTerm] = useState('');

        const translations = {

            featuredTitle: "Featured Perspective",

            searchResults: "Search Results",

        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
